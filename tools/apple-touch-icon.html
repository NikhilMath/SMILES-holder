<!doctype html>
<!-- 180 × 180 iOS icon (iMessage / home screen). Full-bleed: iOS rounds the corners itself. `npm run og` renders it. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Touch icon</title>
    <style>
      html, body { margin: 0; width: 180px; height: 180px; overflow: hidden; background: #1f2026; }
      svg { display: block; width: 180px; height: 180px; }
    </style>
  </head>
  <body>
    <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 5.5 25.5 11v10L16 26.5 6.5 21V11z" fill="none" stroke="#f3f0e8" stroke-width="2.4" stroke-linejoin="round"/><path d="M16 9.6 21.8 13" stroke="#e0703a" stroke-width="2.2" stroke-linecap="round"/></svg>
    <script>window.__ogReady = true;</script>
  </body>
</html>
